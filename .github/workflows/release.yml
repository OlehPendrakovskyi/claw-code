name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 12

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm run typecheck

      - name: Lint
        run: pnpm run lint

      - name: Check rules
        run: pnpm run check:rules

      - name: Compile
        run: pnpm run compile

      - name: Test
        run: pnpm run test:coverage

      - name: Licence check
        run: pnpm run license:check

      - name: Package VSIX
        id: vsix
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          PUBLISHER="$(node -p "require('./package.json').publisher")"
          EXT_NAME="$(node -p "require('./package.json').name")"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "publisher=${PUBLISHER}" >> "$GITHUB_OUTPUT"
          echo "ext_name=${EXT_NAME}" >> "$GITHUB_OUTPUT"
          echo "vsix=out/${EXT_NAME}-${VERSION}.vsix"
          pnpm exec @vscode/vsce@4.0.0 package --no-dependencies -o "out/${EXT_NAME}-${VERSION}.vsix"

      - name: Publish to VS Code Marketplace
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
        run: |
          pnpm exec @vscode/vsce@4.0.0 publish --packagePath "out/${{ steps.vsix.outputs.ext_name }}-${{ steps.vsix.outputs.version }}.vsix" -p "${VSCE_PAT}"

      - name: Publish to Open VSX
        env:
          OVSX_TOKEN: ${{ secrets.OVSX_TOKEN }}
        run: |
          pnpm exec ovsx@1.2.0 publish --packagePath "out/${{ steps.vsix.outputs.ext_name }}-${{ steps.vsix.outputs.version }}.vsix" -p "${OVSX_TOKEN}"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${{ steps.vsix.outputs.version }}"
          gh release create "v${VERSION}" \
            "out/${{ steps.vsix.outputs.ext_name }}-${VERSION}.vsix" \
            --title "v${VERSION}" \
            --generate-notes