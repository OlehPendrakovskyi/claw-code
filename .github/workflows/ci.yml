name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  # A newer push supersedes a PR run; every commit on main keeps its own status.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup pnpm
        uses: pnpm/action-setup@a7487c7e89a18df4991f7f222e4898a00d66ddda # v4.1.0
        with:
          version: 12

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: TEMP diagnose killed git child on Windows
        if: runner.os == 'Windows'
        shell: bash
        run: |
          D=$(mktemp -d); cd "$D"; git init -q; echo start > big.txt; git add big.txt
          git -c user.name=t -c user.email=t@t commit -qm init
          yes 'changed line' | head -n 50000 > big.txt
          GIT=$(node -e 'const p=require("path");for(const d of process.env.PATH.split(";")){const c=p.join(d,"git.exe");if(require("fs").existsSync(c)){console.log(c);break}}')
          echo "git on PATH: $GIT"
          node -e '
          const { spawn, execSync } = require("child_process"); const fs = require("fs");
          const dir = process.cwd(); const git = process.argv[1];
          const child = spawn(git, ["diff"], { cwd: dir, stdio: ["ignore", "pipe", "ignore"] });
          let killed = false;
          child.stdout.on("data", () => { if (!killed) { killed = true; child.kill(); console.log("killed launcher pid", child.pid);
            setTimeout(() => { console.log(execSync("tasklist /FI \"IMAGENAME eq git.exe\"").toString());
              try { fs.rmSync(dir, { recursive: true, force: true, maxRetries: 10, retryDelay: 100 }); console.log("rm ok"); } catch (e) { console.log("rm failed", e.code);
                console.log(execSync("tasklist /FI \"IMAGENAME eq git.exe\"").toString()); } }, 200); } });
          ' "$(cygpath -w "$GIT")"

      # Typecheck, lint and the license check give the same answer on every OS.
      - name: Typecheck
        if: runner.os == 'Linux'
        run: pnpm run typecheck

      - name: Lint
        if: runner.os == 'Linux'
        run: pnpm run lint

      - name: Build
        run: pnpm run compile

      # jest directly: `pnpm run test` would repeat compile and lint through pretest.
      - name: Test
        run: pnpm exec jest

      - name: License check
        if: runner.os == 'Linux'
        run: pnpm run license:check

  # The ruleset on main requires a check named `ci`; this one passes only when every OS did.
  ci:
    needs: test
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every OS to pass
        if: needs.test.result != 'success'
        run: exit 1
