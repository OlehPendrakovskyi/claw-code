name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # A newer push supersedes a PR run. Any other run gets a group of its own, so no commit on main loses its status.
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: true

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup pnpm
        uses: pnpm/action-setup@a7487c7e89a18df4991f7f222e4898a00d66ddda # v4.1.0
        with:
          version: 12

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: TEMP diagnose /.vol realpath
        if: runner.os == 'macOS'
        run: |
          node - <<'DIAG'
          const fs = require('fs'), os = require('os'), path = require('path');
          const tryAll = async (p) => ({
            promises: await fs.promises.realpath(p).catch(e => 'ERR ' + e.code),
            native: (() => { try { return fs.realpathSync.native(p); } catch (e) { return 'ERR ' + e.code; } })(),
          });
          (async () => {
            const root = fs.mkdtempSync(path.join(fs.realpathSync.native(os.tmpdir()), 'vol-'));
            const dirA = path.join(root, 'a'); fs.mkdirSync(dirA);
            const file = path.join(dirA, 'note.txt'); fs.writeFileSync(file, 'x');
            const h = await fs.promises.open(file, 'r');
            const st = await h.stat();
            const vol = `/.vol/${st.dev}/${st.ino}`;
            const out = { file, dev: st.dev, ino: st.ino, vol };
            out.basic = await tryAll(vol);
            out.volDirExists = fs.existsSync('/.vol');
            let t = process.hrtime.bigint();
            for (let i = 0; i < 100; i++) await fs.promises.realpath(vol).catch(() => 0);
            out.avgMicros = Number((process.hrtime.bigint() - t) / 100n) / 1000;
            // Swap by rename: the opened inode now lives under b/.
            fs.renameSync(dirA, path.join(root, 'b'));
            out.afterParentRename = await tryAll(vol);
            out.fdAfterParentRename = await tryAll(`/dev/fd/${h.fd}`);
            // Hard link: two names for one inode.
            const f2 = path.join(root, 'b', 'other.txt'); fs.linkSync(path.join(root, 'b', 'note.txt'), f2);
            out.withHardLink = await tryAll(vol);
            // Deleted but still open.
            fs.unlinkSync(path.join(root, 'b', 'note.txt')); fs.unlinkSync(f2);
            out.afterUnlink = await tryAll(vol);
            // Other volume kinds: a file on the boot volume outside the data volume.
            const sys = fs.statSync('/bin/ls');
            out.systemVolume = { dev: sys.dev, r: await tryAll(`/.vol/${sys.dev}/${sys.ino}`) };
            await h.close();
            console.log(JSON.stringify(out, null, 1));
          })();
          DIAG

      # Typecheck, lint and the license check give the same answer on every OS.
      - name: Typecheck
        if: runner.os == 'Linux'
        run: pnpm run typecheck

      - name: Lint
        if: runner.os == 'Linux'
        run: pnpm run lint

      - name: Build
        run: pnpm run compile

      # jest directly: `pnpm run test` would repeat compile and lint through pretest.
      - name: Test
        run: pnpm exec jest

      - name: License check
        if: runner.os == 'Linux'
        run: pnpm run license:check

  # The ruleset on main requires a check named `ci`; this one passes only when every OS did.
  ci:
    needs: test
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every OS to pass
        if: needs.test.result != 'success'
        run: exit 1
