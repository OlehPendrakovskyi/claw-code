name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # A newer push supersedes a PR run. Any other run gets a group of its own, so no commit on main loses its status.
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: true

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node-version: [24.15, 24]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 12

      # pnpm 12's npm-generated Windows shims call the extensionless `pnpm` beside `pnpm.exe`, which does not run
      # as pnpm (pnpm/pnpm#15688): every pnpm step then passed without doing anything. Its directory goes first on
      # PATH, so `pnpm` is `pnpm.exe` itself.
      - name: Put pnpm.exe on PATH
        if: runner.os == 'Windows'
        run: (Resolve-Path (Join-Path $env:PNPM_HOME '..\pnpm')).Path | Out-File -Append -Encoding utf8 $env:GITHUB_PATH

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node-version }}
          cache: pnpm

      # A pnpm that prints no version would let every later step pass without running.
      - name: Check pnpm runs
        shell: bash
        run: |
          version="$(pnpm --version)"
          echo "pnpm $version"
          test -n "$version"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Typecheck, lint and the license check give the same answer on every OS.
      - name: Typecheck
        if: runner.os == 'Linux'
        run: pnpm run typecheck

      - name: Lint
        if: runner.os == 'Linux'
        run: pnpm run lint

      # Syntax-aware checks for development rules R10, R36, R43 and R54 (scripts/check-rules.mjs).
      - name: Rule checks
        if: runner.os == 'Linux'
        run: pnpm run check:rules

      - name: Build
        run: pnpm run compile

      # the runner directly: `pnpm run test` would repeat compile and lint through pretest.
      # Coverage, with its thresholds, is measured once, on the Linux leg.
      # A step timeout, unlike the job's, fails the step and keeps its log.
      - name: Test
        timeout-minutes: 10
        run: pnpm exec vitest run ${{ runner.os == 'Linux' && '--coverage' || '' }}

      - name: License check
        if: runner.os == 'Linux'
        run: pnpm run license:check

  # The ruleset on main requires a check named `ci`; this one passes only when every OS did.
  ci:
    needs: test
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every OS to pass
        if: needs.test.result != 'success'
        run: exit 1
