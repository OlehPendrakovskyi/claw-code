version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      minor-and-patch:
        update-types:
          - minor
          - patch
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      # CodeQL's init and analyze steps must run the same version, or analyze fails:
      # bump every github/codeql-action step in one pull request.
      codeql-action:
        patterns:
          - github/codeql-action*
